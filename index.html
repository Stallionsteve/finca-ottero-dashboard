<!-- The app updates itself from the public project (Stallionsteve/finca-ottero-dashboard) through jsDelivr;
     the local copies next to this file are used whenever that can't be reached. config.js is always local. -->
<script>
  window.FINCA_REPO = "Stallionsteve/finca-ottero-dashboard";
  window.FINCA_HOUR = Math.floor(Date.now() / 3.6e6);
</script>
<link rel="stylesheet" href="styles.css" id="css-local">

        <linearGradient id="lg-sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="0.55" stop-color="#ff7a5c"/><stop offset="1" stop-color="#ff5c8a"/></linearGradient>
        <linearGradient id="lg-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ee6d6"/><stop offset="1" stop-color="#ff5c8a"/></linearGradient>
        <clipPath id="cp-disc"><circle cx="32" cy="32" r="30"/></clipPath>
      </defs>

        <rect x="0" y="44.5" width="64" height="2.8" fill="#1c1a44"/>
        <circle cx="22.6" cy="32" r="3.2" fill="#0a0f24"/>
        <circle cx="41.4" cy="32" r="3.2" fill="#0a0f24"/>
        <ellipse cx="32" cy="41" rx="11" ry="10" fill="#0a0f24"/>

        <ellipse cx="32" cy="42.4" rx="2.1" ry="1.5" fill="#ff9a3c"/>
        <circle cx="27.4" cy="38.2" r="1.35" fill="#2ee6d6"/>
        <circle cx="36.6" cy="38.2" r="1.35" fill="#2ee6d6"/>

        <path d="M6 57 q4 -2.4 8 0 t8 0 M36 57.5 q4 -2.4 8 0 t8 0" stroke="#2ee6d6" stroke-opacity="0.45" stroke-width="1.2" fill="none" stroke-linecap="round"/>

<div id="layer"></div>
<div id="toast-host" aria-live="polite"></div>
<script src="vendor/haws.umd.js?v=9.4.0"></script>
<script src="config.js?v=8"></script>
<script>
  // Load the latest app from the public project: ask GitHub for the exact latest version (remembered for
  // 10 minutes), fetch that version from jsDelivr (available immediately), and fall back to the copy stored
  // in Home Assistant when offline.
  (function () {
    var key = "finca.sha", local = "?v=8";
    function base(sha) { return "https://cdn.jsdelivr.net/gh/" + window.FINCA_REPO + "@" + (sha || "main") + "/"; }
    function css(url) { var l = document.createElement("link"); l.rel = "stylesheet"; l.href = url; l.onerror = function () { l.remove(); }; document.head.appendChild(l); }
    function load(url, fallback, done) {
      var el = document.createElement("script"); el.src = url; el.onload = done;
      el.onerror = function () { var f = document.createElement("script"); f.src = fallback; f.onload = done; document.body.appendChild(f); };
      document.body.appendChild(el);
    }
    function start(sha) {
      var b = base(sha), q = sha ? "" : "?h=" + window.FINCA_HOUR;
      css(b + "styles.css" + q);
      load(b + "demo.js" + q, "demo.js" + local, function () { load(b + "app.js" + q, "app.js" + local, function () {}); });
    }
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { /* storage unavailable */ }
    if (saved && Date.now() - saved.at < 600000) return start(saved.sha);
    var done = false, timer = setTimeout(function () { if (!done) { done = true; start(saved && saved.sha); } }, 2500);
    fetch("https://api.github.com/repos/" + window.FINCA_REPO + "/commits/main", { headers: { Accept: "application/vnd.github.sha" } })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (sha) {
        if (done) return; done = true; clearTimeout(timer);
        if (sha && /^[0-9a-f]{40}$/.test(sha.trim())) { sha = sha.trim(); try { localStorage.setItem(key, JSON.stringify({ sha: sha, at: Date.now() })); } catch (e) { /* ignore */ } }
        else sha = saved && saved.sha;
        start(sha);
      })
      .catch(function () { if (!done) { done = true; clearTimeout(timer); start(saved && saved.sha); } });
  })();
</script>
</body>
</html>
