<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finca Ottero</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finca Ottero">
<meta name="theme-color" content="#0a0f24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!-- The app updates itself from the public project (Stallionsteve/finca-ottero-dashboard) through jsDelivr;
     the local copies next to this file are used whenever that can't be reached. config.js is always local. -->
<script>
  window.FINCA_CDN = "https://cdn.jsdelivr.net/gh/Stallionsteve/finca-ottero-dashboard@main/";
  window.FINCA_HOUR = Math.floor(Date.now() / 3.6e6);
</script>
<link rel="stylesheet" href="styles.css" id="css-local">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Stallionsteve/finca-ottero-dashboard@main/styles.css" id="css-cdn" onerror="this.remove()">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#home" aria-label="Finca Ottero home">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="lg-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121a3c"/><stop offset="1" stop-color="#2a1a4a"/></linearGradient>
        <linearGradient id="lg-sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="0.55" stop-color="#ff7a5c"/><stop offset="1" stop-color="#ff5c8a"/></linearGradient>
        <linearGradient id="lg-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ee6d6"/><stop offset="1" stop-color="#ff5c8a"/></linearGradient>
        <clipPath id="cp-disc"><circle cx="32" cy="32" r="30"/></clipPath>
      </defs>
      <g clip-path="url(#cp-disc)">
        <rect width="64" height="64" fill="url(#lg-sky)"/>
        <circle cx="32" cy="33" r="19" fill="url(#lg-sun)"/>
        <rect x="0" y="35" width="64" height="1.6" fill="#1c1a44"/>
        <rect x="0" y="39.5" width="64" height="2.2" fill="#1c1a44"/>
        <rect x="0" y="44.5" width="64" height="2.8" fill="#1c1a44"/>
        <circle cx="22.6" cy="32" r="3.2" fill="#0a0f24"/>
        <circle cx="41.4" cy="32" r="3.2" fill="#0a0f24"/>
        <ellipse cx="32" cy="41" rx="11" ry="10" fill="#0a0f24"/>
        <ellipse cx="32" cy="45" rx="6.2" ry="4.3" fill="#1d2756"/>
        <ellipse cx="32" cy="42.4" rx="2.1" ry="1.5" fill="#ff9a3c"/>
        <circle cx="27.4" cy="38.2" r="1.35" fill="#2ee6d6"/>
        <circle cx="36.6" cy="38.2" r="1.35" fill="#2ee6d6"/>
        <path d="M24.5 44.6l-5 -1 M24.5 46.4l-5 .6 M39.5 44.6l5 -1 M39.5 46.4l5 .6" stroke="#2ee6d6" stroke-width="0.8" stroke-linecap="round" fill="none"/>
        <path d="M0 50.5 q4 -3 8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 V64 H0z" fill="#0a0f24" stroke="#2ee6d6" stroke-width="1.6"/>
        <path d="M6 57 q4 -2.4 8 0 t8 0 M36 57.5 q4 -2.4 8 0 t8 0" stroke="#2ee6d6" stroke-opacity="0.45" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </g>
      <circle cx="32" cy="32" r="30.2" fill="none" stroke="url(#lg-ring)" stroke-width="1.6"/>
    </svg>
    <span class="wordmark">FINCA <span>OTTERO</span></span>
  </a>
  <div class="spacer"></div>
  <span class="conn" id="conn">Connecting…</span>
  <span class="clock" id="clock" aria-label="Current time">--:--</span>
</header>
<nav class="nav" aria-label="Sections" id="nav"></nav>
<main id="main" tabindex="-1"><p class="empty">Connecting to Home Assistant…</p></main>
<button class="jarvis-fab" id="jarvis-fab" aria-label="Talk to Jarvis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5"/></svg></button>
<div id="layer"></div>
<div id="toast-host" aria-live="polite"></div>
<script src="vendor/haws.umd.js?v=9.4.0"></script>
<script src="config.js?v=7"></script>
<script>
  // Load demo.js then app.js from the project, falling back to the local copies.
  (function () {
    function load(name, done) {
      var el = document.createElement("script");
      el.src = window.FINCA_CDN + name + "?h=" + window.FINCA_HOUR;
      el.onload = done;
      el.onerror = function () { var l = document.createElement("script"); l.src = name + "?v=7"; l.onload = done; document.body.appendChild(l); };
      document.body.appendChild(el);
    }
    load("demo.js", function () { load("app.js", function () {}); });
  })();
</script>
</body>
</html>
